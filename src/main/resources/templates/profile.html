<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container" style="max-width:760px"><form class="form-card" th:action="@{/customer/profile}" method="post"><div class="eyebrow">Your account</div><h1 style="font-size:2.7rem">Your profile.</h1><p>Keep your contact details current so the rental team can reach you about bookings.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div><div class="field"><label>Full name</label><input name="name" th:value="${account.name}" required maxlength="100"></div><div class="field"><label>Email address</label><input th:value="${account.email}" readonly><small>Email changes are locked in this demo to protect account identity.</small></div><div class="field"><label>Phone number</label><input name="phone" th:value="${account.phone}" required maxlength="30"></div><div class="field"><label>Username</label><input th:value="${account.username}" readonly></div><button class="btn btn-lime">Save profile</button></form></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
