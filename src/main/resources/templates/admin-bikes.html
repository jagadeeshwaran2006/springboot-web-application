<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fleet | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="split-title"><div><div class="eyebrow">Fleet control</div><h1 style="font-size:2.7rem">Your bikes.</h1><p>Add, update and maintain your fleet inventory.</p></div><a class="btn btn-lime" th:href="@{/admin/bikes/new}">+ Add bike</a></div><div th:if="${message}" class="flash" th:text="${message}"></div><div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div><div class="table-wrap"><table><thead><tr><th>Bike</th><th>Registration</th><th>Type / location</th><th>Rate</th><th>Availability</th><th>Actions</th></tr></thead><tbody><tr th:each="b:${bikes}"><td><strong th:text="${b.brand+' '+b.name}">Bike</strong><div class="small-muted" th:text="${b.mileage+' km/l est.'}">Mileage</div></td><td th:text="${b.registrationNumber}">TN00AA0000</td><td><span th:text="${b.bikeType}">Type</span><div class="small-muted" th:text="${b.location}">Location</div></td><td><strong th:text="${'₹'+b.hourlyRate+'/hr'}">₹80/hr</strong><div class="small-muted" th:text="${'₹'+b.dailyRate+'/day'}">₹800/day</div></td><td><span class="badge" th:text="${b.maintenanceStatus}">READY</span><div class="small-muted" th:text="${b.available?'Available':'Unavailable'}">Available</div></td><td><div class="inline-form"><a class="btn btn-light btn-small" th:href="@{/admin/bikes/edit/{id}(id=${b.id})}">Edit</a><form th:action="@{/admin/bikes/delete/{id}(id=${b.id})}" method="post"><button class="btn btn-danger btn-small" onclick="return confirm('Delete this bike?')">Delete</button></form></div></td></tr></tbody></table></div><p style="margin-top:18px"><a class="btn btn-light" th:href="@{/admin}">← Admin overview</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
