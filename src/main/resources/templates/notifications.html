<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Updates</div><h1 style="font-size:2.7rem">Your notifications.</h1><p>Booking status, waitlist alerts and support updates in one place.</p><div class="panel" th:each="n:${notifications}" style="margin-bottom:12px"><div class="split-title"><strong th:text="${n.message}">Message</strong><span class="small-muted" th:text="${#temporals.format(n.createdAt,'dd MMM yyyy HH:mm')}">Date</span></div></div><div class="empty" th:if="${#lists.isEmpty(notifications)}"><div class="emoji">🔔</div><h3>You're all caught up</h3><p>New updates will appear here.</p></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
