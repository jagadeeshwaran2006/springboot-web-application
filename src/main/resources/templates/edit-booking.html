<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modify booking | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container" style="max-width:760px"><form class="form-card" th:action="@{/customer/rental/{id}/edit(id=${rental.id})}" method="post"><div class="eyebrow">Booking update</div><h1 style="font-size:2.6rem">Change your ride.</h1><p th:text="${rental.bookingCode+' · '+rental.bike.brand+' '+rental.bike.name}">Booking</p><div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div><div class="field"><label>New pickup time</label><input type="datetime-local" name="pickup" required th:min="${minPickupValue}" th:value="${pickupValue}"></div><div class="field"><label>New return time</label><input type="datetime-local" name="dropoff" required th:value="${returnValue}"></div><div class="notice">Changing the schedule recalculates the base rental estimate. Coupon and optional add-ons may need to be reapplied by support if your booking changes significantly.</div><button class="btn btn-lime" style="margin-top:18px">Save changes ↗</button> <a class="btn btn-light" th:href="@{/customer/dashboard}">Cancel</a></form></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
