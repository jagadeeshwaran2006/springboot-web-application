<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support desk | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Customer care</div><h1 style="font-size:2.7rem">Support desk.</h1><p>Respond to issues and keep customers informed.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div class="grid-2"><article class="ticket-card" style="padding:20px" th:each="t:${tickets}"><div class="split-title"><span class="pill" th:text="${t.status}">OPEN</span><span class="small-muted" th:text="${'#'+t.id+' · '+t.username}">#1</span></div><h3 style="margin-top:14px" th:text="${t.subject}">Subject</h3><p th:text="${t.message}">Message</p><div class="notice" th:if="${t.adminReply != null}" th:text="${'Your last reply: '+t.adminReply}">Reply</div><form th:action="@{/admin/support/{id}/reply(id=${t.id})}" method="post"><div class="field"><label>Reply</label><textarea name="reply" th:text="${t.adminReply}" placeholder="Write a helpful reply..." required></textarea></div><div class="field"><label>Status</label><select name="status"><option value="OPEN" th:selected="${t.status=='OPEN'}">Open</option><option value="IN_PROGRESS" th:selected="${t.status=='IN_PROGRESS'}">In progress</option><option value="RESOLVED" th:selected="${t.status=='RESOLVED'}">Resolved</option></select></div><button class="btn btn-small btn-lime">Update ticket</button></form></article></div><div class="empty" th:if="${#lists.isEmpty(tickets)}">No support tickets yet.</div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
