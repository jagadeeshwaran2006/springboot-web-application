<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Community</div><h1 style="font-size:2.7rem">Customer directory.</h1><p>Registered customer profiles and account status overview.</p><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Email</th><th>Phone</th><th>Account status</th></tr></thead><tbody><tr th:each="c:${customers}"><td th:text="${c.name}">Name</td><td th:text="${c.email}">Email</td><td th:text="${c.phone}">Phone</td><td><span class="pill">Registered</span></td></tr></tbody></table></div><p style="margin-top:18px"><a class="btn btn-light" th:href="@{/admin}">← Admin overview</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
