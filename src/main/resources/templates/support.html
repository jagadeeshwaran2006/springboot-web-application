<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">We can help</div><h1 style="font-size:2.7rem">Support that stays with you.</h1><p>Ask a question, report an issue and follow your ticket until it is resolved.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div><div class="split"><form class="panel" th:action="@{/customer/support}" method="post"><h2>Create a ticket</h2><div class="field"><label>Subject</label><input name="subject" required maxlength="150" placeholder="Booking issue, refund question..."></div><div class="field"><label>How can we help?</label><textarea name="message" required maxlength="2000" placeholder="Share the details so our team can help."></textarea></div><button class="btn btn-lime">Submit request</button></form><div><h2>Your requests</h2><div class="ticket-card" style="padding:18px;margin-bottom:12px" th:each="t:${tickets}"><div class="split-title"><span class="pill" th:text="${t.status}">OPEN</span><span class="small-muted" th:text="${'#'+t.id}">#1</span></div><h3 style="margin-top:12px" th:text="${t.subject}">Subject</h3><p th:text="${t.message}">Message</p><div class="notice" th:if="${t.adminReply != null}" th:text="${'Team reply: '+t.adminReply}">Reply</div><span class="small-muted" th:text="${#temporals.format(t.createdAt,'dd MMM yyyy HH:mm')}">Date</span></div><div class="empty" th:if="${#lists.isEmpty(tickets)}">No tickets yet. Create one if you need assistance.</div></div></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
