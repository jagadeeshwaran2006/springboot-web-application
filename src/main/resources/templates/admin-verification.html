<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verification review | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Safety operations</div><h1 style="font-size:2.7rem">Verification requests.</h1><p>Review submitted document metadata. This demo does not store actual document images or full ID numbers.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div class="grid-2"><article class="panel" th:each="v:${requests}"><div class="split-title"><h3 th:text="${v.username}">Customer</h3><span class="pill" th:text="${v.status}">PENDING</span></div><p th:text="${v.documentType+' · ending '+v.lastFour}">Document</p><p class="small-muted" th:text="${#temporals.format(v.submittedAt,'dd MMM yyyy HH:mm')}">Date</p><form th:action="@{/admin/verification/{id}(id=${v.id})}" method="post"><div class="field"><label>Decision</label><select name="status"><option value="PENDING" th:selected="${v.status=='PENDING'}">Pending</option><option value="VERIFIED" th:selected="${v.status=='VERIFIED'}">Verified</option><option value="REJECTED" th:selected="${v.status=='REJECTED'}">Rejected</option></select></div><div class="field"><label>Admin note</label><textarea name="note" th:text="${v.adminNote}" placeholder="Reason or next steps"></textarea></div><button class="btn btn-lime">Save decision</button></form></article></div><div class="empty" th:if="${#lists.isEmpty(requests)}">No verification requests yet.</div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
