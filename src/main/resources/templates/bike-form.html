<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bike form | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><form class="form-card" th:action="@{/admin/bikes/save}" th:object="${bike}" method="post"><h1 style="font-size:2.4rem" th:text="${bike.id == null ? 'Add a bike' : 'Update bike details'}">Bike</h1><p>Accurate specifications, pricing and availability help customers book with confidence.</p><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Bike name / model</label><input th:field="*{name}" required><small th:errors="*{name}"></small></div><div class="field"><label>Brand</label><input th:field="*{brand}" required><small th:errors="*{brand}"></small></div><div class="field"><label>Registration number</label><input th:field="*{registrationNumber}" required><small th:errors="*{registrationNumber}"></small></div><div class="field"><label>Bike type</label><select th:field="*{bikeType}" required><option value="">Choose type</option><option>Commuter</option><option>Scooter</option><option>Sport</option><option>Touring</option><option>Adventure</option><option>Electric</option></select><small th:errors="*{bikeType}"></small></div><div class="field"><label>Hourly rate (₹)</label><input type="number" min="1" step="0.01" th:field="*{hourlyRate}" required><small th:errors="*{hourlyRate}"></small></div><div class="field"><label>Daily rate (₹)</label><input type="number" min="1" step="0.01" th:field="*{dailyRate}" required></div><div class="field"><label>Estimated mileage (km/l)</label><input type="number" min="1" th:field="*{mileage}" required></div><div class="field"><label>Pickup location</label><input th:field="*{location}" placeholder="e.g. Chennai Central"></div></div><div class="field"><label>Bike image URL (optional)</label><input th:field="*{imageUrl}" placeholder="https://..."><small>Use a photo URL you have permission to use.</small></div><div class="field"><label>Description</label><textarea th:field="*{description}" placeholder="Comfort, use case, luggage capacity and important details"></textarea></div><div class="form-grid"><div class="field"><label>Maintenance status</label><select th:field="*{maintenanceStatus}"><option value="READY">Ready</option><option value="MAINTENANCE">Under maintenance</option><option value="INSPECTION">Needs inspection</option></select></div><div class="field"><label>Available for booking?</label><select th:field="*{available}"><option th:value="true">Yes</option><option th:value="false">No</option></select></div></div><button class="btn btn-lime" type="submit">Save bike ↗</button> <a class="btn btn-light" th:href="@{/admin/bikes}">Cancel</a></form></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
