<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maintenance | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Fleet health</div><h1 style="font-size:2.7rem">Maintenance & safety.</h1><p>Log service work and keep bikes unavailable until they pass inspection.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div class="split"><form class="panel" th:action="@{/admin/maintenance}" method="post"><h2>Log a service</h2><div class="field"><label>Bike</label><select name="bikeId" required><option th:each="b:${bikes}" th:value="${b.id}" th:text="${b.brand+' '+b.name+' · '+b.registrationNumber}"></option></select></div><div class="field"><label>Service notes</label><textarea name="notes" required placeholder="Oil change, brake inspection, tyre replacement..."></textarea></div><div class="field"><label>Cost (₹)</label><input name="cost" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Next service date</label><input name="nextServiceDate" type="date"></div><button class="btn btn-lime">Save service record</button></form><div class="panel"><h2>Fleet readiness</h2><div class="table-wrap"><table><thead><tr><th>Bike</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="b:${bikes}"><td th:text="${b.brand+' '+b.name}">Bike</td><td><span class="badge" th:text="${b.maintenanceStatus}">READY</span></td><td><form th:if="${b.maintenanceStatus != 'READY'}" th:action="@{/admin/bikes/{id}/release(id=${b.id})}" method="post"><button class="btn btn-small btn-lime">Mark ready</button></form><span th:if="${b.maintenanceStatus == 'READY'}" class="small-muted">Ready to ride</span></td></tr></tbody></table></div></div></div><section class="section"><h2>Service history</h2><div class="table-wrap"><table><thead><tr><th>Bike</th><th>Notes</th><th>Service date</th><th>Next service</th><th>Cost</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${r.bike.brand+' '+r.bike.name}">Bike</td><td th:text="${r.notes}">Notes</td><td th:text="${r.serviceDate}">Date</td><td th:text="${r.nextServiceDate != null ? r.nextServiceDate : 'Not set'}">Next</td><td th:text="${'₹'+r.cost}">₹0</td></tr></tbody></table></div></section></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
