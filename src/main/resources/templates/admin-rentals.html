<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bookings | RideLoop Admin</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Rental operations</div><h1 style="font-size:2.7rem">Bookings & returns.</h1><p>Confirm pickup, complete returns, track deposits and review late fees.</p><div th:if="${message}" class="flash" th:text="${message}"></div><div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}"></div><div class="table-wrap"><table><thead><tr><th>Booking / customer</th><th>Bike</th><th>Schedule</th><th>Status / payment</th><th>Estimated / final</th><th>Action</th></tr></thead><tbody><tr th:each="r:${rentals}"><td><strong th:text="${r.bookingCode}">BR-000</strong><div th:text="${r.customer.name}">Customer</div><div class="small-muted" th:text="${r.customer.phone}">Phone</div></td><td th:text="${r.bike.brand+' '+r.bike.name}">Bike</td><td><span th:text="${r.scheduledPickup != null ? #temporals.format(r.scheduledPickup,'dd MMM HH:mm') : #temporals.format(r.startTime,'dd MMM HH:mm')}">Pickup</span><br><span class="small-muted" th:text="${r.scheduledReturn != null ? #temporals.format(r.scheduledReturn,'dd MMM HH:mm') : 'Return not scheduled'}">Return</span></td><td><span class="badge" th:text="${r.status}">BOOKED</span><div class="small-muted" th:text="${(r.paymentPaid?'Paid (demo)':'Unpaid')+' · Deposit '+r.depositStatus}">Payment</div></td><td><strong th:text="${'₹'+r.totalAmount}">₹0</strong><div class="small-muted" th:text="${r.couponCode != null ? 'Coupon '+r.couponCode : 'No coupon'}">Coupon</div></td><td><form th:if="${r.status == 'BOOKED'}" th:action="@{/admin/rentals/{id}/start(id=${r.id})}" method="post"><button class="btn btn-small btn-lime">Check out</button></form><form th:if="${r.status == 'ACTIVE'}" th:action="@{/admin/rentals/{id}/return(id=${r.id})}" method="post"><label class="small-muted"><input type="checkbox" name="conditionOk" value="true" checked> Good condition</label><input name="conditionNotes" placeholder="Condition notes" style="display:block;max-width:170px;margin:5px 0"><input name="conditionPhotoUrl" placeholder="Photo URL (optional)" style="display:block;max-width:170px;margin:5px 0"><button class="btn btn-small" style="margin-top:6px">Complete return</button></form><span th:if="${r.status == 'COMPLETED' or r.status == 'CANCELLED'}" class="small-muted">No action</span></td></tr></tbody></table></div><p style="margin-top:18px"><a class="btn btn-light" th:href="@{/admin}">← Admin overview</a></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
