<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Favourites | RideLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="content"><div class="container"><div class="eyebrow">Your shortlist</div><h1 style="font-size:2.7rem">Bikes you love.</h1><p>Save bikes now and return when you're ready to book.</p><div class="grid" th:if="${!#lists.isEmpty(favorites)}"><article class="bike-card" th:each="fav:${favorites}"><div class="bike-image"><img th:if="${fav.bike.imageUrl != null and !fav.bike.imageUrl.isBlank()}" th:src="${fav.bike.imageUrl}" th:alt="${fav.bike.name}"><div class="bike-placeholder" th:if="${fav.bike.imageUrl == null or fav.bike.imageUrl.isBlank()}">🏍️</div></div><div class="bike-content"><h3 th:text="${fav.bike.brand+' '+fav.bike.name}">Bike</h3><p th:text="${fav.bike.location}">Location</p><div class="price-row"><div class="price"><strong th:text="${'₹'+fav.bike.dailyRate}">₹800</strong><span>/ day</span></div><a class="btn btn-small" th:href="@{/bike/{id}(id=${fav.bike.id})}">Details ↗</a></div><form th:action="@{/customer/favorite/{id}(id=${fav.bike.id})}" method="post" style="margin-top:12px"><button class="btn btn-light btn-small">Remove favourite</button></form></div></article></div><div class="empty" th:if="${#lists.isEmpty(favorites)}"><div class="emoji">♡</div><h3>Your shortlist is waiting</h3><p>Save a bike from the catalogue and it will appear here.</p><a class="btn btn-lime" th:href="@{/catalog}">Explore bikes</a></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
